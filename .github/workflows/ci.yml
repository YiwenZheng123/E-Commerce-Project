name: CI

on:
    push:
        branches: [main]
    workflow_dispatch:
jobs:
    backend:
        name: Backend tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                java-version: 17
                distribution: temurin
                cache: maven
                cache-dependency-path: backend/pom.xml
            - name: Make mvnw executable
              run: chmod +x mvnw
            - name: Run tests
              run: ./mvnw -B verify 
              
