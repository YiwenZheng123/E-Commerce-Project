name: CI

on:
    push:
        branches: [main]
    workflow_dispatch:
jobs:
    backend:
        name: Backend tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ecommerce
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U portgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DB_PASSWORD: postgres
            JWT_SECRET: Y2ktb25seS1kdW1teS1qd3Qtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=
            STRIPE_SECRET_KEY: sk_test_ci_placeholder

        steps:
            - name: Check out code
              uses: actions/checkout@v4
            
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                java-version: 17
                distribution: temurin
                cache: maven
                cache-dependency-path: backend/pom.xml
            - name: Make mvnw executable
              run: chmod +x mvnw
            - name: Run tests
              run: ./mvnw -B verify 


    frontend:
            name: Frontend (lint + test + build)
            runs-on: ubuntu-latest

            defaults:
                run:
                    working-directory: Frontend/ecom-frontend


                
            steps:
                - name: Check out code
                  uses: actions/checkout@v4
                
                - name: Set up Node 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: Frontend/ecom-frontend/package-lock.json

                - name: Install dependencies
                  run: npm ci

                - name: Lint
                  run: npm run lint
                  continue-on-error: true

                - name: Unit tests
                  run: npm run test:cart

                - name: Build
                  run: npm run build
                  env:
                    VITE_BACK_END_URL: http://localhost:8080
