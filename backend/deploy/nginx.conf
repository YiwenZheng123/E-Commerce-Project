# shortcut: the IP can change after EC2 stop/start; use a stable IP for a permanent URL.
server {
    listen 80;
    server_name 52.15.49.45;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://52.15.49.45$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 52.15.49.45;

    ssl_certificate /etc/letsencrypt/live/52.15.49.45/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52.15.49.45/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
