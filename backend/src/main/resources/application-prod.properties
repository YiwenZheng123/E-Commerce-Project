server.address=127.0.0.1
server.forward-headers-strategy=framework

spring.datasource.url=${ECOM_DB_URL}
spring.datasource.username=${ECOM_DB_USERNAME}
spring.datasource.password=${ECOM_DB_PASSWORD}
spring.app.jwtSecret=${ECOM_JWT_SECRET}
frontend.url=${ECOM_PUBLIC_URL}
image.base.url=${ECOM_PUBLIC_URL}/images

app.seed-demo-users=false
spring.ecom.app.cookieSecure=true
